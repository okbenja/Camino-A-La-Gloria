<!DOCTYPE html>
<html lang="es" data-theme="classic" data-animations="on" data-density="balanced" data-table-compact="false" data-transparency="on" data-high-contrast="false">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090c12">
<meta name="application-name" content="TouchGrass">
<meta name="description" content="Simulador de sociedad autónoma, persistente y multigeneracional.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./src/styles/base.css">
<link rel="stylesheet" href="./src/styles/themes.css">
<title>TouchGrass V11.5 — Mundo Social Profundo</title>
<script>window.__TG_BASE_PATH__=(location.hostname.endsWith('github.io')||location.pathname.startsWith('/touchgrass'))?'/touchgrass':'';</script>
</head>
<body>
<div id="startOverlay" class="overlay">
  <div class="modal">
    <div class="center" style="font-size:42px">🎲</div>
    <h2 class="center">TouchGrass V11.5</h2>
    <p class="center muted">Vive dentro de una sociedad autónoma, persistente y multigeneracional.</p>
    <div class="form">
      <div class="two"><label>Nombre<input id="newName" maxlength="22" value="Alex"></label><label>Apellido<input id="newSurname" maxlength="22" value="Rojas"></label></div>
      <div class="two"><label>País<select id="newCountry"></select></label><label>Identidad<select id="newGender"><option value="person">Persona no binaria</option><option value="woman">Mujer</option><option value="man">Hombre</option></select></label></div>
      <div class="two"><label>Orientación<select id="newOrientation"><option value="questioning">En exploración</option><option value="hetero">Heterosexual</option><option value="gay">Homosexual</option><option value="bi">Bisexual</option><option value="pan">Pansexual</option><option value="asexual">Asexual</option></select></label><label>Dificultad<select id="newDifficulty"><option value="easy">Relajada</option><option value="normal" selected>Normal</option><option value="hard">Cruel</option></select></label></div>
      <label>Origen<select id="newBackground"><option value="random">Aleatorio</option><option value="humble">Familia humilde</option><option value="middle">Clase media</option><option value="wealthy">Familia adinerada</option></select></label>
      <label class="switch"><span><b>🧬 God Mode desde el nacimiento</b><small class="muted">Edita atributos y activa ventajas gratuitamente.</small></span><input id="newGod" type="checkbox"></label>
      <button class="btn primary" onclick="newLife()">👶 Nacer</button>
      <button id="continueBtn" class="btn ghost hidden" onclick="loadGame(true)">▶️ Continuar partida</button>
    </div>
  </div>
</div>
<div id="modalOverlay" class="overlay hidden"><div class="modal"><button class="modal-close" onclick="closeModal()">✕</button><div id="modalContent"></div></div></div>
<div id="toast" class="toast"></div>
<nav id="primaryNav" class="nav-shell" aria-label="Secciones principales"></nav>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div><h1>TouchGrass</h1><small id="subtitle">V11.5 · Mundo Social Profundo</small></div>
      <div class="top-actions"><button class="icon-btn" id="saveButton" title="Guardar" aria-label="Guardar">💾</button><button class="icon-btn" id="settingsButton" title="Ajustes" aria-label="Ajustes">⚙️</button></div>
    </div>
  </header>
  <section class="hero" id="playerHero">
    <div class="hero-main"><div class="identity"><div class="avatar" id="avatar">🧑</div><div style="min-width:0"><h2 id="charName">Alex Rojas</h2><p id="charInfo">Nueva partida</p></div></div><div><div class="money" id="money">$0</div><div class="job-label" id="jobName">Sin ocupación</div></div></div>
    <div class="stats" id="stats"><div class="stat"><div class="stat-head"><span>😊 Felicidad</span><b>—</b></div><div class="bar"><div class="fill" style="width:0"></div></div></div></div>
    <div class="quick-row"><div class="quick"><b id="quickActions">3</b><span>Acciones</span></div><div class="quick"><b id="quickFame">0</b><span>Fama</span></div><div class="quick"><b id="quickStress">0</b><span>Estrés</span></div><div class="quick"><b id="quickKarma">0</b><span>Karma</span></div></div>
  </section>
  <main id="routeOutlet" class="route-outlet" aria-live="polite"><div class="route-loading">Cargando vista…</div></main>
</div>
<script src="./src/legacy/touchgrass-engine.js"></script>
<script type="module" src="./src/app/bootstrap.js"></script>
</body>
</html>
